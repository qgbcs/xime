# =============================================
# Xime Lua 插件元数据（宿主用 YAML 解析）
#
# 约定：
# - 插件包为 zip（.xipk），本文件置于包根目录
# - 逻辑用 Lua 脚本实现（entry 指定入口），不包含任何可执行二进制
# - 资源放 resources/ 目录，脚本通过 host.resource.path() 获取路径
# - 依赖的纯 Lua 库放 libs/ 目录，脚本用 require() 加载（受限）
# =============================================

# 插件唯一标识（反向域名风格，插件管理/激活/清理均依赖）
id: com.kingzcheung.xime.plugin.kaomoji

# 插件名称与描述（插件中心展示）
name: 颜文字表情包
description: 包含 174 个常用颜文字的表情插件

# 插件中心列表图标（字符图标，宿主渲染；也可留空用默认）
icon: "థ౪థ"

# 插件版本（字符串，Lua 插件无 APK versionCode 概念）
version: 2.1.0

# 插件分类，决定归入插件中心的哪个分组与可用能力：
#   emoji    表情（多选启用，即时生效）
#   speech   语音识别（单选激活）
#   prediction 智能联想（预留）
type: emoji

# 激活方式：single（单选，如语音识别）/ multi（多选，如表情）/ none（无）
activation: multi

# 入口脚本（相对插件包根目录）
entry: main.lua

# 宿主最低版本要求（满足则加载，不满足插件中心提示不可用）
minHostVersion: 2.6.0

# 能力声明：宿主据此决定如何消费该插件
capabilities:
  emoji:
    supportsSearch: true   # 支持按文本搜索表情
    categories:            # 插件内置的分类（可选，宿主也可运行时查询）
      - 颜文字

# 配置字段声明（宿主直接渲染表单，无需先执行脚本）
# 类型：text | secret | select | multi_select | switch | number
configSchema: []
