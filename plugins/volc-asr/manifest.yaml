# =============================================
# Xime Lua 插件元数据（宿主用 YAML 解析）
# =============================================

# 插件唯一标识
id: com.kingzcheung.xime.plugin.volc_asr

# 插件名称与描述（语音转文本服务商列表展示）
name: 火山引擎流式语音识别
icon: "🎙️"
description: 火山方舟在线语音识别。使用火山引擎控制台获取的APP Key，可参考 快速入门（https://console.volcengine.com/speech/new/setting/apikeys?projectName=default）

# 插件版本（字符串）
version: 1.0.1

# 插件分类：speech 语音识别（单选激活）
type: speech
activation: single

# 入口脚本
entry: main.lua

# 宿主最低版本要求
minHostVersion: 2.6.0

# 能力声明
capabilities:
  speech:
    inputMode: streaming    # 实时流式识别
    supportsPartialResults: true

# 网络访问声明：插件需要连接的域名（宿主据此校验白名单/用户授权）
network:
  hosts:
    - openspeech.bytedance.com

# 配置字段声明（插件中心直接渲染表单）
configSchema:
  - key: apiKey
    label: API Key
    type: secret
    placeholder: 输入火山方舟 API Key
    helpText: 在火山引擎方舟平台申请开通流式语音识别后获取
  - key: appKey
    label: App Key（旧鉴权）
    type: secret
    required: false
    placeholder: 旧版 App Key（可选）
    section: 旧鉴权
  - key: accessKey
    label: Access Key（旧鉴权）
    type: secret
    required: false
    placeholder: 旧版 Access Key（可选）
    section: 旧鉴权
  - key: resourceId
    label: 模型资源 ID
    type: text
    defaultValue: volc.seedasr.sauc.duration
    placeholder: volc.seedasr.sauc.duration
    helpText: 默认流式识别 2.0（volc.seedasr.sauc.duration）；1.0 模型填 volc.bigasr.sauc.duration
