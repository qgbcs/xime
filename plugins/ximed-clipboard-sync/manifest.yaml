# =============================================
# Xime Lua 插件元数据（宿主用 YAML 解析）
# =============================================

# 插件唯一标识
id: com.kingzcheung.xime.plugin.ximed_sync

# 插件名称与描述
name: ximed 剪贴板同步
icon: "🔗"
description: 对接 ximed HTTP 接口的双向剪贴板同步（文本），需要安装 ximed 服务器端和 ximed 客户端(https://github.com/kingzcheung/ximed)

# 插件版本（字符串）
version: 0.1.0

# 插件分类：clipboard_sync 剪贴板同步（单选激活）
type: clipboard_sync
activation: single

# 入口脚本
entry: main.lua

# 宿主最低版本要求
minHostVersion: 2.6.0

# 能力声明
capabilities:
  clipboard_sync:
    protocols:
      - ximed-http   # 对接 ximed 服务器的 /api/clipboard HTTP 接口

# 网络访问声明：服务器地址由用户配置，域名不固定。
# allowCustomHosts: 接受用户填写的服务器地址域名，经配置后自动授权联网
network:
  hosts: []
  allowCustomHosts: true

# 配置字段声明（插件中心直接渲染表单）
configSchema:
  - key: serverUrl
    label: 服务器地址
    type: text
    placeholder: https://host:port
    helpText: ximed 服务器地址（形如 https://192.168.1.50:8080）
  - key: username
    label: 用户名
    type: text
    required: false
  - key: password
    label: 密码
    type: secret
    required: false
  - key: testConnection
    label: 测试连接
    type: button
    action: testConnection
    required: false
